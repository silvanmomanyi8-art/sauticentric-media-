<!DOCTYPE html>
<html lang="en">
<head>

      background-color: #0f0f0f;

      text-align: center;
      padding: 40px 20px;
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #1a1a1a;
      padding: 30px;

      border: 1px solid #333;

    h1 {

    }
    p {
      color: #cccccc;
      font-size: 16px;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      background-color: #ff0000;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="badge">🔴 LIVE NOW</span>
    <h1>Sauticentric Media</h1>
    <p>Welcome to the official platform for Sauticentric Media news, live streaming, podcasts, and creative services.</p>

</html>
